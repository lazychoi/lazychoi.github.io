<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영어 듣기</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="listening.css">
</head>

<body>
  <nav class="nav">
    <div class="nav-header">
      <a href="index.html" class="nav-logo">🎧 영어 듣기</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="메뉴 열기">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
    <div class="nav-menu" id="nav-menu">
      <a href="index.html" class="nav-link">
        <span class="nav-icon">🏠</span> 홈
      </a>
      <a href="farm.html" class="nav-link">
        <span class="nav-icon">🌱</span> 용어 노트
      </a>
      <a href="flashcards.html" class="nav-link">
        <span class="nav-icon">🗂️</span> 플래시카드
      </a>
      <a href="hanja.html" class="nav-link">
        <span class="nav-icon">📗</span> 한글(한자)
      </a>
      <a href="rebalance.html" class="nav-link">
        <span class="nav-icon">⚖️</span> 자산 리밸런싱
      </a>
      <a href="listening.html" class="nav-link active">
        <span class="nav-icon">🎧</span> 영어 듣기
      </a>
      <a href="timeline.html" class="nav-link">
        <span class="nav-icon">⏳</span> 세계사 연표
      </a>
      <a href="genealogy.html" class="nav-link">
        <span class="nav-icon">🌳</span> 가계도
      </a>
    </div>
  </nav>

  <div class="app-container">
    <div class="panel main-panel">
      <!-- <h2>🎧 영어 듣기</h2> -->
      <!-- File Selector Setup -->
      <div class="setup-bar">
        <div class="import-buttons-group">
          <div class="file-input-wrapper">
            <button class="btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 19V6l12-3v13M9 10l12-3M9 14a3 3 0 11-6 0 3 3 0 016 0zm12 2a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
              음원 선택
            </button>
            <input type="file" id="audio-file" accept="audio/*,.mp3,audio/mpeg,.m4a,audio/mp4,audio/x-m4a,.wav,audio/wav">
          </div>
          <div class="file-input-wrapper">
            <button class="btn">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
              대본 선택
            </button>
            <input type="file" id="subtitle-file" accept=".srt,.vtt,.txt,text/plain,text/srt,text/vtt,text/*,*/*">
          </div>
          <div class="select-wrapper">
            <select id="speed-select" title="배속 조절" style="width: 100%;">
              <option value="0.5">0.50x</option>
              <option value="0.75">0.75x</option>
              <option value="0.9">0.90x</option>
              <option value="1.0" selected>1.00x</option>
              <option value="1.1">1.10x</option>
              <option value="1.2">1.20x</option>
              <option value="1.5">1.50x</option>
              <option value="2.0">2.00x</option>
            </select>
          </div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
          <span style="font-size: 13px; color: var(--text-muted);" id="loaded-audio-name">로드된 음원 없음</span>
          <div style="display: flex; gap: 6px; align-items: center;">
            <button class="btn" id="btn-export-data" style="padding: 4px 10px; font-size: 12px; display: none;" title="학습 데이터 TXT 파일로 내보내기">데이터 내보내기</button>
            <button class="btn" id="btn-clear-storage" style="padding: 4px 10px; font-size: 12px; display: none;" title="저장된 학습 데이터 초기화">초기화</button>
          </div>
        </div>
      </div>

      <!-- Player Controls -->
      <div class="player-container">
        <!-- Custom Timeline (Moved Above Buttons) -->
        <div class="timeline-container">
          <div class="timeline-slider-wrapper" id="timeline-wrapper">
            <div class="timeline-track-bg">
              <div class="timeline-loop-zone" id="timeline-loop-zone"></div>
              <div class="timeline-progress" id="timeline-progress"></div>
            </div>
            <div class="timeline-handle" id="timeline-handle" style="left: 0%;"></div>
          </div>
          <div class="timeline-time-display">
            <span id="current-time-display">00:00.00</span>
            <span id="total-time-display">00:00.00</span>
          </div>
        </div>

        <div class="player-main-controls">
          <div class="playback-controls">
            <!-- Play/Pause -->
            <button class="btn btn-primary" id="btn-play-pause" title="재생/멈춤 (Space)">
              <svg width="24" height="24" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
            </button>
            <!-- Prev Section -->
            <button class="btn" id="btn-prev-section" title="이전 구간 (←)">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"></path></svg>
            </button>
            <!-- Next Section -->
            <button class="btn" id="btn-next-section" title="다음 구간 (→)">
              <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"></path></svg>
            </button>
            <!-- Repeat Current Toggle -->
            <button class="btn" id="btn-repeat-toggle" title="한 구간 반복 재생 (R)">
              loop
            </button>
            <div class="repeat-count-wrapper">
              <span class="repeat-label">반복</span>
              <select id="repeat-count-select" title="반복 횟수">
                <option value="3">3</option>
                <option value="5" selected>5</option>
                <option value="7">7</option>
                <option value="10">10</option>
                <option value="∞">∞</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Subtitle Controls -->
      <div class="transcript-controls">
        <button class="btn" id="btn-deselect-all" title="모든 구간 선택 해제">전체 해제</button>
        <button class="btn" id="btn-toggle-subtitles" title="자막 보이기/가리기 토글">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          <span id="subtitle-toggle-text">자막 가리기</span>
        </button>
      </div>

      <!-- Subtitle Scroll Pane -->
      <div class="transcript-pane" id="transcript-pane">
        <div class="no-subtitle-prompt" id="empty-prompt-view">
          <div class="icon">📂</div>
          <h3>음원과 대본 파일을 선택해 주세요.</h3>
          <p style="max-width: 450px; font-size: 14px;">
            SRT 자막 파일(.srt) 또는 시작/종료시간과 자막이 탭으로 구분된 텍스트(.txt) 파일과 오디오(.mp3) 파일을 각각 업로드해 학습을 진행하세요.
          </p>
        </div>
      </div>
    </div>
  </div>

  <audio id="audio-player" style="display: none;"></audio>

  <script src="listening.js"></script>
  <script>
    document.getElementById('nav-toggle').addEventListener('click', function() {
      document.getElementById('nav-menu').classList.toggle('open');
    });
  </script>
</body>

</html>
