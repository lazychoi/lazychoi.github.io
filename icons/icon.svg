<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#1e3a8a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="0" y="0" width="512" height="512" rx="115" fill="url(#bgGradient)" />

  <!-- Inner glow & border -->
  <rect x="2" y="2" width="508" height="508" rx="113" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="4" />

  <!-- Toolbox / Isometric Box -->
  <g filter="url(#shadow)">
    <!-- Grip -->
    <path d="M 216 170 L 216 125 Q 216 110 231 110 L 281 110 Q 296 110 296 125 L 296 170" 
          fill="none" stroke="rgba(255, 255, 255, 0.95)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Top Face -->
    <polygon points="256,156 351,211 256,266 161,211" fill="rgba(255, 255, 255, 0.95)" />

    <!-- Left Face -->
    <polygon points="161,211 256,266 256,376 161,321" fill="rgba(219, 234, 254, 0.85)" />

    <!-- Right Face -->
    <polygon points="256,266 351,211 351,321 256,376" fill="rgba(191, 219, 254, 0.75)" />

    <!-- Edges highlight -->
    <line x1="256" y1="266" x2="256" y2="376" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3" />
    <line x1="256" y1="266" x2="161" y2="211" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3" />
    <line x1="256" y1="266" x2="351" y2="211" stroke="rgba(255, 255, 255, 0.6)" stroke-width="3" />

    <!-- Star / Sparkle -->
    <circle cx="371" cy="166" r="16" fill="white" />
    <circle cx="150" cy="150" r="8" fill="rgba(255, 255, 255, 0.7)" />
  </g>
</svg>
