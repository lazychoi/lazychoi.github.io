<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>플래시카드 학습</title>

  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="도구상자">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <script src="js/pwa.js" defer></script>
  <script src="js/nav.js" defer></script>

  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/flashcards.css?v=8">
  <!-- KaTeX for rendering LaTeX math formulas -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <!-- marked.js for rendering markdown -->
  <script src="js/lib/marked.min.js"></script>
</head>

<body>
  <!-- 네비게이션 바 -->
  <nav class="nav">
    <div class="nav-header">
      <a href="index.html" class="nav-logo">🗂️ 플래시카드</a>
      <button class="nav-toggle" id="nav-toggle" aria-label="메뉴 열기">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
      </button>
    </div>
    <div class="nav-menu" id="nav-menu"></div>
  </nav>

  <div class="flashcard-container">
    
    <!-- 1단계: 데이터 붙여넣기 화면 -->
    <div id="selectionView" class="glass-panel">
      <!-- 구분자 설정 및 파일 불러오기 영역 -->
      <div class="filter-section delimiter-bar">
        <div class="delimiter-control-group">
          <label for="delimiterSelect" class="delimiter-label">구분자</label>
          <select id="delimiterSelect" class="delimiter-select">
            <option value="|" selected>| (파이프)</option>
            <option value=";">; (세미콜론)</option>
            <option value="tab">Tab (탭)</option>
            <option value="custom">기타 (직접 입력)</option>
          </select>
          <input type="text" id="customDelimiter" class="custom-delimiter-input" placeholder="구분자 입력" style="display: none;">
        </div>

        <div class="paste-actions">
          <span id="parsedCountBadge" class="parsed-count-badge">0개 카드</span>
          <button type="button" id="btnLoadHighlights" class="btn btn-secondary btn-mini">📂 영어읽기앱 형광펜</button>
          <input type="file" id="highlightFileInput" accept=".json,application/json" style="display: none;">
          <button type="button" id="btnLoadDeckJson" class="btn btn-secondary btn-mini">📄 json 파일</button>
          <input type="file" id="deckJsonFileInput" accept=".json,application/json" style="display: none;">
          <button type="button" id="btnLoadImageJson" class="btn btn-secondary btn-mini">🖼️ 이미지 json</button>
          <input type="file" id="imageJsonFileInput" accept=".json,application/json" style="display: none;">
          <button type="button" id="btnClearData" class="btn btn-secondary btn-mini">초기화</button>
        </div>
      </div>

      <!-- 데이터 붙여넣기 영역 -->
      <div class="paste-wrapper">
        <textarea
          id="dataInput"
          class="data-textarea"
          placeholder="여기에 학습할 데이터를 붙여넣으세요. (한 줄에 카드 1개)&#10;&#10;예시:&#10;광합성|식물이 빛에너지를 이용해 양분을 스스로 만드는 과정&#10;미토콘드리아|세포 호흡을 통해 에너지를 생산하는 세포 소기관&#10;기회비용|하나를 선택함으로써 포기해야 하는 다른 대안의 최대 가치"
          rows="12"
        ></textarea>
      </div>

      <!-- 학습 방법 설정 영역 -->
      <div class="study-method-bar">
        <span class="study-method-label">학습 방법</span>
        <div class="study-order-group" role="group" aria-label="학습 순서">
          <button type="button" id="btnOrderSequential" class="study-order-btn active" data-order="sequential">순서대로</button>
          <button type="button" id="btnOrderRandom" class="study-order-btn" data-order="random">무작위로</button>
        </div>
        <div class="study-chunk-group">
          <label for="chunkSizeSelect" class="study-chunk-label">n개씩</label>
          <select id="chunkSizeSelect" class="delimiter-select study-chunk-select">
            <option value="all" selected>전체</option>
            <option value="5">5</option>
            <option value="7">7</option>
            <option value="10">10</option>
          </select>
        </div>
      </div>

      <div class="start-action-container">
        <button id="btnStartStudy" class="btn btn-primary" style="width: 100%; max-width: 400px; padding: 14px 20px; font-size: 16px; margin-top: 16px;" disabled>
          ⚡ 학습 시작하기 (0개)
        </button>
      </div>
    </div>

    <!-- 2단계: 플래시카드 학습 진행 화면 -->
    <div id="studyView" class="glass-panel" style="display: none;">
      <div class="study-header">
        <span id="btnBackToList" class="back-link">
          ⬅ 데이터 입력으로 돌아가기
        </span>
        <span id="studyDeckTitle" class="study-deck-title"></span>
        <span id="progressText" class="study-progress-text">1 / 10</span>
      </div>

      <!-- 프로그레스바 -->
      <div class="progress-bar-container">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>

      <!-- 플래시카드 3D 컨테이너 -->
      <div id="flashcard" class="card-perspective">
        <div id="cardInner" class="card-inner">
          
          <!-- 앞면 -->
          <div class="card-face card-front">
            <div id="cardFrontTitle" class="card-front-title">질문</div>
            <div id="cardFrontSentence" class="card-front-sentence" style="display: none;"></div>
          </div>
          
          <!-- 뒷면 -->
          <div class="card-face card-back">
            <div id="cardBackHeader" class="card-back-header">
              <div id="cardBackTerm" class="card-back-term">질문</div>
              <div id="cardBackSentence" class="card-back-sentence" style="display: none;"></div>
            </div>
            <div id="cardBackMeaning" class="card-back-meaning meaning">
              답변이 이곳에 표시됩니다.
            </div>
          </div>

        </div>
      </div>

      <!-- 컨트롤러 -->
      <div class="study-controls">
        <div class="main-controls">
          <button id="btnPrev" class="btn btn-secondary">◀ 이전</button>
          <button id="btnFlip" class="btn btn-secondary">🔄 뒤집기</button>
          <button id="btnNext" class="btn btn-secondary">다음 ▶</button>
        </div>
        
        <!-- 알겠음 / 모르겠음 피드백 단축 버튼 -->
        <div class="study-feedback-controls">
          <button id="btnUnknown" class="btn btn-danger feedback-btn">
            ❌ 틀림
          </button>
          <button id="btnKnown" class="btn btn-success feedback-btn">
            ✔️ 맞춤
          </button>
        </div>
      </div>

      <div class="shortcut-tips">
        단축키: <kbd>Space</kbd> 뒤집기 | <kbd>←</kbd> 이전 | <kbd>→</kbd> 다음 | <kbd>1</kbd> 틀림 | <kbd>2</kbd> 맞춤 | <kbd>Esc</kbd> 입력 화면으로
      </div>
    </div>

    <!-- 3단계: 학습 결과 통계 화면 -->
    <div id="statsView" class="glass-panel" style="display: none;">
      <div class="result-panel">
        <h2 id="statsTitle">🎉 학습을 완료했습니다!</h2>
        <p id="statsSubtitle" class="stats-subtitle">학습 통계를 보여줍니다.</p>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">총 학습 카드</div>
            <div id="statTotal" class="stat-value total">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">맞춤 (학습 완료)</div>
            <div id="statKnown" class="stat-value known">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">틀림 (복습 필요)</div>
            <div id="statUnknown" class="stat-value unknown">0</div>
          </div>
        </div>

        <div class="result-actions">
          <button id="btnNextChunk" class="btn btn-primary" style="display: none;">➡️ 다음 학습하기</button>
          <button id="btnRestart" class="btn btn-primary">🔄 다시 학습하기</button>
          <button id="btnStudyFailed" class="btn btn-danger" style="display: none;">❌ 틀린 것만 복습</button>
          <button id="btnBackFromStats" class="btn btn-secondary">데이터 입력으로 돌아가기</button>
        </div>
      </div>
    </div>

  </div>

  <script src="js/flashcards.js?v=8"></script>
</body>

</html>
